name: Build MUSIC-Pro

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
      - run: gradle assembleRelease --stacktrace --no-daemon
      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MUSIC-Pro.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/*.apk out/MUSIC-Pro.apk
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: MUSIC-Pro
          path: out/MUSIC-Pro.apk
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v6.0.${{ github.run_number }}
          name: MUSIC·Pro 极致版 v6.0.${{ github.run_number }}
          files: out/MUSIC-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

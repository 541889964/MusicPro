plugins { id 'com.android.application' }

android {
    namespace 'com.music.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.music.app.pro"
        minSdk 21
        targetSdk 34
        versionCode 80
        versionName "8.0.0"
        multiDexEnabled true
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
        resConfigs 'en','zh-rCN','zh-rTW','ja','ko','fr','de','es','ru','ar','hi','th','vi','id','pt','it','tr','pl','nl'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
    }
    aaptOptions { noCompress 'otf','ttf','jpg','jpeg','json','wav','mp3' }
    bundle {
        language { enableSplit = false }
        density  { enableSplit = false }
        abi      { enableSplit = false }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.2.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.airbnb.android:lottie:6.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

plugins { id 'com.android.application' }
android {
    namespace 'com.music.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.music.app.pro"
        minSdk 21
        targetSdk 34
        versionCode 100
        versionName "10.0.0"
        multiDexEnabled true
    }
    buildTypes {
        release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions { resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES'] }
    aaptOptions { noCompress 'jpg','jpeg','png','json','wav' }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
